<!-- This Faces composition page extends the layout template -->
<ui:composition
        template="/WEB-INF/faces-templates/layout.xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="primefaces">

    <!-- Page metadata -->
    <ui:param name="title" value="Employee Search"/>

    <!-- Define main content -->
    <ui:define name="maincontent">
        <div class="card">
            <h1>Employee Search</h1>

            <!-- Employee search form -->
            <h:form id="query_form">
                <p:panel id="formPanel" header="Search Employees">

                    <!-- TODO: Add Department AutoComplete and search buttons -->

                    <!-- wee added autocomplte from slide/chat part 1 ccode -->
                    <div class="field grid">
                        <p:outputLabel for="@next"
                                       styleClass="col-fixed">
                            Department Name
                        </p:outputLabel>

                        <div class="col">
                            <p:autoComplete id="selectedDepartment"
                                            value="#{currentEmployeeQueryView.selectedDepartment}"
                                            completeMethod="#{currentEmployeeQueryView.completeDepartment}"
                                            var="department"
                                            itemLabel="#{department.departmentName}"
                                            itemValue="#{department}"
                                            converter="#{departmentConverter}"
                                            forceSelection="true"
                                            scrollHeight="250"
                            />
                        </div>
                    </div>

                    <!-- wee added search buttons and clear button code here from slide/chat part 2 ccode -->
                    <div class="field">
                        <p:commandButton value="Search By Department"
                                         styleClass="col-fixed"
                                         action="#{currentEmployeeQueryView.onSearchByDepartment()}"
                                         update=":messages :growl @form :outputPanel"
                        />
                    </div>

                    <div class="field">
                        <p:commandButton value="Clear"
                                         action="#{currentEmployeeQueryView.onClear()}"
                                         update="@form :outputPanel"
                                         styleClass="ui-button-secondary"
                        />
                    </div>




                </p:panel>
            </h:form>

            <!-- TODO: Add Employee Search Results DataTable -->
            <!-- Employee Search Results -->
            <h:form prependId="false" id="outputPanel">
                <div class="card">
                    <p:dataTable id="dataTable"
                                 value="#{currentEmployeeQueryView.queryResults}"
                                 var="currentItem"
                                 reflow="true"

                                 paginator="true"
                                 rows="10"
                                 paginatorPosition="bottom">

                        <p:column headerText="Name">
                            <h:outputText value="#{currentItem.firstName} #{currentItem.lastName}" />

                        </p:column>

                        <p:column headerText="Hire Date">
                            <h:outputText value="#{currentItem.hireDate}">
                                <f:convertDateTime type="localDate"
                                                   pattern="MM/dd/yyyy"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Salary">
                            <h:outputText value="#{currentItem.salary}">
                                <f:convertNumber type="currency"
                                                 locale="en_CA"/>
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Department">
                            <h:outputText
                                    value="#{currentItem.department.departmentName}"/>
                        </p:column>

                        <p:column headerText="Manager">
                            <h:outputText value="#{currentItem.manager.firstName} #{currentItem.manager.lastName}"
                                          rendered="#{not empty currentItem.manager}" />
                            <h:outputText value="No Manager"
                                          rendered="#{empty currentItem.manager}" />

                        </p:column>

                    </p:dataTable>
                </div>
            </h:form>




        </div>
    </ui:define>

</ui:composition>
