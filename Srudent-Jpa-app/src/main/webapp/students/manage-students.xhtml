<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:faces="jakarta.faces"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:f="jakarta.faces.core"
        xmlns:h="jakarta.faces.html"
        xmlns:pt="jakarta.faces.passthrough"
        xmlns:cc="jakarta.faces.composite"
        xmlns:c="jakarta.tags.core"
        xmlns:fn="jakarta.tags.functions"
        xmlns:o="http://omnifaces.org/ui"
        xmlns:of="http://omnifaces.org/functions"
        xmlns:p="primefaces"
        template="/WEB-INF/faces-templates/layout.xhtml"
>

    <ui:param name="title" value="Students - CRUD"/>

    <ui:param name="internalstyles"
              value=".Studentss-table-header { display: flex; align-items:center; justify-content: space-between; flex-wrap: wrap; }"/>

    <ui:define name="maincontent">

        <div class="card">
            <h:form id="form">
                <p:growl id="growl" showDetail="true">
                    <p:autoUpdate/>
                </p:growl>

                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton id="newButton"
                                         value="New"
                                         icon="pi pi-plus"
                                         actionListener="#{currentStudentsCrudView.onOpenNew}"
                                         update=":dialogs:manage-Students-content"
                                         oncomplete="PF('manageStudentsDialog').show()"
                                         styleClass="ui-button-success"
                                         style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:manage-Students-content"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-Studentss" widgetVar="dtStudentss"
                             value="#{currentStudentsCrudView.studentss}"
                             var="currentItem"
                             reflow="true"
                             selection="#{currentStudentsCrudView.selectedStudents}"
                             rowKey="#{currentItem.Long}"
                             paginator="true" rows="10"
                             paginatorPosition="bottom">

                    <f:facet name="header">
                        <div class="Studentss-table-header">
                            <span style="font-weight: bold">Studentss</span>
                            <span class="filter-container ui-input-icon-left">
                                <i class="pi pi-search"></i>
                                <p:inputText id="globalFilter" onkeyup="PF('dtStudentss').filter()"
                                             placeholder="Search"/>
                            </span>
                        </div>
                    </f:facet>


                    <p:column headerText="First Name" filterBy="#{currentItem.property1}">
                        <h:outputText value="#{currentItem.firstName}"/>
                    </p:column>
                    <p:column headerText="Last Name" filterBy="#{currentItem.property2}">
                        <h:outputText value="#{currentItem.lastName}"/>
                    </p:column>
                    <p:column headerText="Course Section">
                        <h:outputText value="#{currentItem.courseSection}"/>
                    </p:column>

                    <p:column exportable="false" ariaHeaderText="Actions">
                        <p:commandButton icon="pi pi-pencil"
                                         update=":dialogs:manage-Students-content"
                                         oncomplete="PF('manageStudentsDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-success"
                                         process="@this">
                            <f:setPropertyActionListener value="#{currentItem}"
                                                         target="#{currentStudentsCrudView.selectedStudents}"/>
                            <f:setPropertyActionListener value="#{currentItem.Long}"
                                                         target="#{currentStudentsCrudView.selectedId}"/>
                            <p:resetInput target=":dialogs:manage-Students-content"/>
                        </p:commandButton>
                        <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash"
                                         process="@this"
                                         oncomplete="PF('deleteStudentsDialog').show()">
                            <f:setPropertyActionListener value="#{currentItem}"
                                                         target="#{currentStudentsCrudView.selectedStudents}"/>
                            <f:setPropertyActionListener value="#{currentItem.Long}"
                                                         target="#{currentStudentsCrudView.selectedId}"/>
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </h:form>

            <h:form id="dialogs">
                <p:dialog header="Students Details" showEffect="fade" modal="true" widgetVar="manageStudentsDialog"
                          responsive="true">

                    <p:messages id="messages">
                        <p:autoUpdate/>
                    </p:messages>

                    <p:outputPanel id="manage-Students-content" class="ui-fluid">
                        <p:outputPanel rendered="#{not empty currentStudentsCrudView.selectedStudents}">
                            <!-- TODO: Add input field for each editable property of the entity -->
                            <div class="field">
                                <p:outputLabel for="@next">First Name</p:outputLabel>
                                <p:inputText
                                        id="firstName"
                                        value="#{currentStudentsCrudView.selectedStudents.field1Name}">
                                </p:inputText>
                            </div>
                            <div class="field">
                                <p:outputLabel for="@next">Last Name</p:outputLabel>
                                <p:inputText
                                        id="lastName"
                                        value="#{currentStudentsCrudView.selectedStudents.field2Name}">
                                </p:inputText>
                            </div>
                            <div class="field">
                                <p:outputLabel for="@next">Course Section</p:outputLabel>
                                <p:inputText
                                        id="courseSection"
                                        value="#{currentStudentsCrudView.selectedStudents.field2Name}">
                                </p:inputText>
                            </div>

                        </p:outputPanel>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton id="saveButton"
                                         value="Save"
                                         icon="pi pi-check"
                                         actionListener="#{currentStudentsCrudView.onSave}"
                                         update="manage-Students-content"
                                         process="manage-Students-content @this"/>

                        <p:commandButton id="generateDataButton"
                                         value="Generate Data"
                                         icon="pi pi-calculator"
                                         actionListener="#{currentStudentsCrudView.onGenerateData}"
                                         update="manage-Students-content"
                                         process="@this"/>

                        <p:commandButton id="cancelButton"
                                         value="Cancel"
                                         icon="pi pi-times"
                                         onclick="PF('manageStudentsDialog').hide()"
                                         class="ui-button-secondary"
                                         type="button"/>
                    </f:facet>
                </p:dialog>

                <p:confirmDialog widgetVar="deleteStudentsDialog" showEffect="fade" width="300"
                                 message="Delete the Students?" header="Confirm" severity="warn">
                    <p:commandButton value="Yes" icon="pi pi-check" actionListener="#{currentStudentsCrudView.onDelete}"
                                     process="@this"
                                     oncomplete="PF('deleteStudentsDialog').hide()"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                     onclick="PF('deleteStudentsDialog').hide()"/>
                </p:confirmDialog>

                <p:confirmDialog global="true" showEffect="fade" width="300">
                    <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"
                                     icon="pi pi-times"/>
                </p:confirmDialog>
            </h:form>

        </div>

    </ui:define>

</ui:composition>
